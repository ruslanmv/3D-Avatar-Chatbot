        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: monospace;
                background: #111;
                color: #eee;
                padding: 20px;
            }
            h1 {
                margin-bottom: 10px;
            }
            .controls {
                margin: 15px 0;
                display: flex;
                gap: 10px;
                align-items: center;
            }
            button {
                padding: 8px 18px;
                font-size: 14px;
                cursor: pointer;
                border: none;
                border-radius: 4px;
            }
            #run-btn {
                background: #4caf50;
                color: #fff;
            }
            #run-btn:disabled {
                background: #555;
                cursor: wait;
            }
            #stop-btn {
                background: #f44336;
                color: #fff;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }
            th,
            td {
                padding: 6px 10px;
                border: 1px solid #333;
                text-align: left;
                font-size: 13px;
            }
            th {
                background: #222;
            }
            .pass {
                color: #4caf50;
                font-weight: bold;
            }
            .fail {
                color: #f44336;
                font-weight: bold;
            }
            .skip {
                color: #ff9800;
            }
            .running {
                color: #2196f3;
            }
            .pending {
                color: #666;
            }
            #summary {
                margin-top: 15px;
                padding: 10px;
                background: #1a1a1a;
                border-radius: 4px;
            }
            #log {
                margin-top: 10px;
                max-height: 300px;
                overflow-y: auto;
                padding: 10px;
                background: #0a0a0a;
                border-radius: 4px;
                font-size: 12px;
                white-space: pre-wrap;
            }
        </style>
    </head>

            let mod = null;
            let stopped = false;
            let audioCtx = null;

            function log(msg) {
                const el = document.getElementById('log');
                el.textContent += msg + '\n';
                el.scrollTop = el.scrollHeight;
            }

            function setRow(i, voice, status, bytes, time, error) {
                const row = document.getElementById('row-' + i);
                if (!row) return;
                const cls =
                    status === 'PASS'
                        ? 'pass'
                        : status === 'FAIL'
                          ? 'fail'
                          : status === 'SKIP'
                            ? 'skip'
                            : status === 'RUNNING'
                              ? 'running'
                              : 'pending';
                row.innerHTML = `
                <td>${i + 1}</td>
                <td>${voice.id}</td>
                <td>${voice.lang}</td>
                <td>${voice.gender}</td>
                <td>${voice.quality}</td>
                <td class="${cls}">${status}</td>
                <td>${bytes || '-'}</td>
                <td>${time || '-'}</td>
                <td style="color:#f88;font-size:11px">${error || ''}</td>
            `;
            }

            function updateSummary(pass, fail, skip, total) {
                document.getElementById('summary').innerHTML =
                    `<span class="pass">PASS: ${pass}</span> &nbsp; ` +
                    `<span class="fail">FAIL: ${fail}</span> &nbsp; ` +
                    `<span class="skip">SKIP: ${skip}</span> &nbsp; ` +
                    `Total: ${total}`;
            }

            async function playBlob(blob) {
                if (!document.getElementById('play-audio').checked) return;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const buf = await audioCtx.decodeAudioData(await blob.arrayBuffer());
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.connect(audioCtx.destination);
                src.start(0);
                // Wait for playback to finish (or max 3s)
                await new Promise((r) => {
                    src.onended = r;
                    setTimeout(r, Math.min(buf.duration * 1000 + 200, 3000));
                });
            }

            window.runTests = async function () {
                const btn = document.getElementById('run-btn');
                btn.disabled = true;
                stopped = false;

                // Build table rows
                const tbody = document.getElementById('results');
                tbody.innerHTML = '';
                for (let i = 0; i < VOICES.length; i++) {
                    const tr = document.createElement('tr');
                    tr.id = 'row-' + i;
                    tbody.appendChild(tr);
                    setRow(i, VOICES[i], 'PENDING', '', '', '');
                }

                document.getElementById('log').textContent = '';
                log('Loading piper-tts-web module...');

                try {
                    mod = await import(CDN_URL);
                    log('Module loaded. predict=' + typeof mod.predict + ' TtsSession=' + typeof mod.TtsSession);
                } catch (e) {
                    log('FATAL: Failed to load module: ' + e);
                    btn.disabled = false;
                    return;
                }

                let pass = 0,
                    fail = 0,
                    skip = 0;

                for (let i = 0; i < VOICES.length; i++) {
                    if (stopped) {
                        skip++;
                        setRow(i, VOICES[i], 'SKIP', '', '', 'stopped');
                        continue;
                    }

                    const v = VOICES[i];
                    setRow(i, v, 'RUNNING', '', '', '');
                    document.getElementById('progress').textContent = `${i + 1}/${VOICES.length}`;

                    // Reset singleton to force new model load
                    if (mod.TtsSession) mod.TtsSession._instance = null;

                    const t0 = performance.now();
                    try {
                        log(`[${i + 1}/${VOICES.length}] Testing ${v.id}...`);
                        const blob = await mod.predict({ voiceId: v.id, text: v.text });
                        const ms = Math.round(performance.now() - t0);

                        if (!blob || blob.size === 0) {
                            throw new Error('Empty audio blob');
                        }

                        // Verify it's decodable
                        if (!audioCtx) audioCtx = new AudioContext();
                        await audioCtx.decodeAudioData(await blob.slice().arrayBuffer());

                        pass++;
                        setRow(i, v, 'PASS', blob.size.toLocaleString(), ms + 'ms', '');
                        log(`  ✓ PASS (${blob.size} bytes, ${ms}ms)`);

                        await playBlob(blob);
                    } catch (err) {
                        const ms = Math.round(performance.now() - t0);
                        fail++;
                        const errMsg = String(err).slice(0, 120);
                        setRow(i, v, 'FAIL', '-', ms + 'ms', errMsg);
                        log(`  ✗ FAIL: ${errMsg}`);
                    }

                    updateSummary(pass, fail, skip, VOICES.length);
                }

                // Final remaining skips
                for (let i = 0; i < VOICES.length; i++) {
                    const row = document.getElementById('row-' + i);
                    if (row && row.querySelector('.pending')) {
                        skip++;
                        setRow(i, VOICES[i], 'SKIP', '', '', '');
                    }
                }

                updateSummary(pass, fail, skip, VOICES.length);
                log(`\nDone. PASS=${pass} FAIL=${fail} SKIP=${skip}`);

                if (fail > 0) {
                    log('\n--- FAILED VOICES (remove from PiperWasmTTSProvider.js) ---');
                    for (let i = 0; i < VOICES.length; i++) {
                        const row = document.getElementById('row-' + i);
                        if (row && row.querySelector('.fail')) {
                            log(`  ✗ ${VOICES[i].id}`);
                        }
                    }
                }

                btn.disabled = false;
            };

            window.stopTests = function () {
                stopped = true;
            };
