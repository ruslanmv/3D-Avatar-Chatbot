<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="190" rx="12" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="40" width="190" height="90" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="115" y="75" font-weight="bold" fill="#0d47a1">Meta Quest 3 / phone</text>
    <text x="115" y="98" font-size="13" fill="#263238">3D Avatar in the browser</text>
    <text x="115" y="116" font-size="12" fill="#546e7a">your mic · her voice</text>
    <rect x="285" y="40" width="190" height="90" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="380" y="75" font-weight="bold" fill="#311b92">OllaBridge Cloud</text>
    <text x="380" y="98" font-size="13" fill="#263238">signs you in (pairing)</text>
    <text x="380" y="116" font-size="12" fill="#546e7a">holds the SonicAgent key</text>
    <rect x="550" y="40" width="190" height="90" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="645" y="75" font-weight="bold" fill="#1b5e20">SonicAgent (HF Space)</text>
    <text x="645" y="98" font-size="13" fill="#263238">Whisper: speech → text</text>
    <text x="645" y="116" font-size="12" fill="#546e7a">Piper: text → 49 voices</text>
  </g>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#a)"><line x1="212" y1="72" x2="282" y2="72"/><line x1="477" y1="72" x2="547" y2="72"/><line x1="547" y1="100" x2="477" y2="100"/><line x1="282" y1="100" x2="212" y2="100"/></g>
  <g font-size="11" fill="#37474f" text-anchor="middle"><text x="247" y="64">audio / text</text><text x="512" y="64">relayed</text><text x="512" y="116">voice, text</text><text x="247" y="116">streamed</text></g>
  <text x="380" y="170" font-size="12" fill="#546e7a" text-anchor="middle">The chat itself stays with your LLM. SonicAgent only listens and speaks.</text>
</svg>
