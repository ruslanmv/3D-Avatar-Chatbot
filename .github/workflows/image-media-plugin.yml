name: Image Media Plugin

on:
    pull_request:
        paths:
            - 'src/features/images/**'
            - 'api/images/**'
            - 'tests/image-plugin.test.js'
            - 'src/features/discovery/DiscoverySettings.js'
            - 'api/_allowlist.js'
            - '.env.example'
            - 'vercel.json'
            - 'docs/IMAGE_PLUGIN.md'
            - '.github/workflows/image-media-plugin.yml'
    push:
        branches: [master]
        paths:
            - 'src/features/images/**'
            - 'api/images/**'
            - 'tests/image-plugin.test.js'
            - 'src/features/discovery/DiscoverySettings.js'
            - 'api/_allowlist.js'
            - '.env.example'
            - 'vercel.json'
            - 'docs/IMAGE_PLUGIN.md'
            - '.github/workflows/image-media-plugin.yml'

permissions:
    contents: write

jobs:
    validate:
        name: Image plugin tests & format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Syntax check
              run: |
                  node --check src/features/images/ImagePlugin.js
                  node --check api/images/search.js
                  node --check src/features/discovery/DiscoverySettings.js
                  node --check api/_allowlist.js

            - name: Image plugin tests
              run: npx jest tests/image-plugin.test.js --ci --runInBand

            - name: Apply canonical formatting
              run: >-
                  npx prettier --write
                  src/features/images/ImagePlugin.js
                  tests/image-plugin.test.js

            - name: Commit formatting to this same-repository PR
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add src/features/images/ImagePlugin.js tests/image-plugin.test.js
                  if ! git diff --cached --quiet; then
                    git commit -m 'Format image provider updates'
                    git push origin HEAD:${{ github.head_ref }}
                  fi

            - name: Format check
              run: >-
                  npx prettier --check
                  src/features/images/ImagePlugin.js
                  api/images/search.js
                  tests/image-plugin.test.js
                  src/features/discovery/DiscoverySettings.js
                  api/_allowlist.js
                  vercel.json
                  docs/IMAGE_PLUGIN.md