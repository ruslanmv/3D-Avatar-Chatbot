<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Q9. HomePilot app icon: the HomePilot mark from assets/homepilot-logo.svg (house + AI core +
       signal), centred on the app's own dark colour (#071821, the manifest's theme/background).
       Strokes are heavier than the logo's so the house still reads at favicon size.
       Rendered to PNG/ICO by tools/brand/render-app-icons.mjs. -->
  <defs>
    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2233"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- The mark lives in a 100-unit box centred on (50, 50); scale 3.9 → about 300 px tall. -->
  <g transform="translate(256 256) scale(3.9) translate(-50 -50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 12 L85 38 L85 88 L15 88 L15 38 Z" stroke="url(#hp-grad)" stroke-width="5"/>
    <rect x="38" y="60" width="24" height="28" rx="3" stroke="url(#hp-grad)" stroke-width="3.5" fill="url(#hp-grad)" fill-opacity="0.12"/>
    <circle cx="50" cy="45" r="11" fill="url(#hp-grad)" opacity="0.22"/>
    <circle cx="50" cy="45" r="6.5" fill="url(#hp-grad)" opacity="0.55"/>
    <circle cx="50" cy="45" r="3" fill="url(#hp-grad)"/>
    <path d="M63 39 Q69 45 63 51" stroke="#06b6d4" stroke-width="2.6" opacity="0.7"/>
    <path d="M67 35 Q75 45 67 55" stroke="#3b82f6" stroke-width="2.2" opacity="0.5"/>
    <path d="M37 39 Q31 45 37 51" stroke="#06b6d4" stroke-width="2.6" opacity="0.7"/>
    <path d="M33 35 Q25 45 33 55" stroke="#3b82f6" stroke-width="2.2" opacity="0.5"/>
  </g>
</svg>
